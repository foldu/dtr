# GitHub is a mirror of the GitLab repository, and this runs the same command
# the GitLab runner runs: `nix flake check`. The gates are
# `checks.x86_64-linux` in flake.nix — the suite, the benchmark payloads, the
# desktop entry, the justfile's formatting and the one-file assertion, which
# cross-compiles `dtr.exe` — so a red job here and a red job on the lab runner
# mean the same thing. Add a gate to the flake, never to this file.
#
# Actions are pinned by commit SHA: this workflow runs on a mirror and a moved
# major tag is a silent code change.
name: ci

on:
  push:
    # No branch filter. The mirror's default branch is whatever GitHub was
    # given, and this file said `main` once while the repository said `master`,
    # which is a pipeline that never runs.
    tags-ignore: ["**"] # tags are release.yml's business
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    # A cold `nix flake check` builds the dependency graph, the from-source
    # libghostty-vt and the Windows cross toolchain, and runs the suite; the
    # binary cache below is what makes the next one minutes.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          # Upstream Nix: nothing here needs Determinate Nix or FlakeHub.
          determinate: false
          diagnostic-endpoint: ""
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Why Magic Nix Cache:
      #  * It caches individual store paths, keyed by path. The expensive parts
      #    here are a from-source libghostty-vt (Zig) and a wgpu/mesa closure —
      #    tens of GB in total, which is a poor fit for one tarball against
      #    GitHub's 10 GB cache limit. A commit that touches only crates/dtr
      #    reuses all of them.
      #  * Paths already on cache.nixos.org are skipped rather than duplicated.
      #  * No secrets, so pull requests get the same treatment.
      # Both of its costs fail soft: a cache miss is a slower run, not a broken
      # one. If it starts thrashing, the upgrade path is a real binary cache —
      # Cachix (free for OSS, needs CACHIX_AUTH_TOKEN) or self-hosted Attic —
      # which would also let local builds pull the same paths.
      - name: Enable the Nix binary cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-gha-cache: enabled
          use-flakehub: "false"
          diagnostic-endpoint: ""

      # `-L` so a cold build reports progress instead of looking hung.
      - name: Check
        run: nix flake check -L

      # The one gate that cannot live in the flake: it fetches the RustSec
      # database, and a pinned copy would be a check that only knows last
      # month's advisories. Everything else about it is in deny.toml.
      - name: Advisories
        run: nix develop .#default --command cargo deny check advisories

      # Not a second build: `checks.single-exe` has already built the exe, so
      # this is a copy out of the store into something downloadable.
      - name: Collect dtr.exe
        run: |
          set -euo pipefail
          out="$(nix build .#windows --no-link --print-out-paths)"
          rm -rf dist
          mkdir -p dist
          cp "$out/bin/dtr.exe" dist/dtr.exe
          # A PE image, not an ELF and not an empty file.
          test "$(head -c 2 dist/dtr.exe)" = "MZ"
          file dist/dtr.exe
          (cd dist && sha256sum dtr.exe > dtr.exe.sha256 && cat dtr.exe.sha256)

      - name: Upload dtr.exe
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dtr-windows-${{ github.sha }}
          path: |
            dist/dtr.exe
            dist/dtr.exe.sha256
          if-no-files-found: error
          retention-days: 14
