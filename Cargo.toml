[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Unlicense"
# dtr is an application, not a library: nothing here is published, and the
# members depend on each other by path, so `cargo publish` would fail on them
# anyway. Saying so is what lets cargo-deny treat those path dependencies as the
# internal ones they are (`deny.toml`).
publish = false

[profile.profiling]
inherits = "release"
# Flamegraphs are unreadable without symbols; this profile exists only for
# `scripts/flamegraph.sh`, so the shipped release stays stripped.
debug = true
strip = false

[workspace.dependencies]
# VT core. Pinned to a git rev, not crates.io: 0.2.2's bindings reference C
# functions that do not exist at the ghostty commit the sys crate pins (PLAN §12.4).
# This rev's `GHOSTTY_COMMIT` is what flake.nix fetches — move both together, and
# see PLAN §12.6 for why it is not the `vt-1.0.0` tag.
libghostty-vt = { git = "https://github.com/Uzaaft/libghostty-rs", rev = "84373f8d48b8f0b794e259f74a71a52686616f5d", default-features = false }
libc = "0.2"
mimalloc = "0.1"
nucleo-matcher = "0.3"
# The caption's maximise button has to answer WM_NCHITTEST with HTMAXBUTTON or
# Windows 11 never offers its snap layouts, and winit has no hook for it: the
# window procedure is subclassed for that one message. Windows-only.
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
libghostty-vt-sys = { git = "https://github.com/Uzaaft/libghostty-rs", rev = "84373f8d48b8f0b794e259f74a71a52686616f5d", default-features = false, features = ["pkg-config"] }

anyhow = "1"
dtr-sftp = { path = "crates/dtr-sftp" }
dtr-vfs = { path = "crates/dtr-vfs" }
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
dirs = "6"
egui = { version = "0.37", features = ["default_fonts"] }
egui-wgpu = "0.37"
# SVG icons: lucide ships them as SVG, and this rasterises them for egui. The
# `image` feature is the other half of `include_image!`: without it a PNG source
# has no decoder, and egui's only symptom is the ⚠ it paints for an image that
# failed to load — which is what the caption icon was showing.
egui_extras = { version = "0.37", features = ["svg", "image"] }
egui-winit = "0.37"
# Drives egui without a window: clicks, keys and snapshot rendering. Shared by
# the binary's surfaces and by `dtr-widgets`, whose gallery is a baseline too, so
# both compare against the same rasteriser (`just fmt`'s gate runs the same suite).
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }
# The system clipboard, written directly: egui-winit's own clipboard path
# silently falls back to an in-app buffer when it cannot reach a display, which
# looks exactly like a copy that worked.
arboard = "3"
# inotify on Linux, ReadDirectoryChangesW on Windows: a device can appear
# without the user doing anything.
notify = "8"
glob = "0.3"
plist = "1.10"
png = "0.18"
# Hover previews. PNG and JPEG only, and no encoders for anything else: the one
# place dtr writes a picture is `--screenshot`, which uses `png` directly.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# The system file dialogs, which is the one part of a terminal that has to be the
# desktop's own: the XDG portal on Linux (with a zenity fallback), the Common Item
# Dialog on Windows. `xdg-portal` and not `gtk3`, so the Linux build pulls no GTK
# in; `wayland` lets the portal be told which surface the dialog belongs to.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "wayland"] }
pollster = "0.4"
portable-pty = "0.9"
redb = "4"
toml_edit = "0.23"
serialport = "4"
pprof = { version = "0.14", features = ["flamegraph"] }
rustc-demangle = "0.1"
swash = "0.2"
# Terminal cells are laid out on a wcwidth grid: a character is one cell or two.
unicode-width = "0.2"
# Quoting for the command a reconnected ssh session runs in the shell at the
# *other* end. A path can hold anything but `/` and NUL, and hand-rolled quoting
# is the kind of code that looks right until it meets a `'`.
shlex = "2"
fontique = "0.12"
tempfile = "3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "io-util", "macros"] }
tokio-serial = "5"
# Reading the desktop's own colours on Linux: the XDG settings portal is one
# D-Bus call, and zbus is a pure-Rust client for it. The `tokio` transport is the
# point — dtr already runs two tokio runtimes, so this reuses them instead of
# putting `async-io`'s second reactor beside them (77 lock entries against 86,
# measured; see `docs/gtk-palette.md` §6). Optional, because it is a whole D-Bus
# stack for two numbers (23 packages added to `Cargo.lock`): without it the Linux
# reader takes the scheme from the theme's name, which is a palette but not a live
# one.
zbus = { version = "5", default-features = false, features = ["tokio"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# rfd says "Using zenity fallback" and "failed to …" through `log`; this is what
# puts those lines in `-v` next to everything else. Without it a dialog that never
# appeared is a silence with no cause in the log.
tracing-log = "0.2"
wgpu = "30"
winit = "0.30"
