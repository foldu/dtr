[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Unlicense"

[profile.profiling]
inherits = "release"
# Flamegraphs are unreadable without symbols; this profile exists only for
# `scripts/flamegraph.sh`, so the shipped release stays stripped.
debug = true
strip = false

[workspace.dependencies]
# VT core. Pinned to a git rev, not crates.io: 0.2.2's bindings reference C
# functions that do not exist at the ghostty commit the sys crate pins (PLAN §12.4).
libghostty-vt = { git = "https://github.com/Uzaaft/libghostty-rs", rev = "9ede35b8ea94a55ed3608408d67e102883129f1e", default-features = false }
libc = "0.2"
mimalloc = "0.1"
nucleo-matcher = "0.3"
libghostty-vt-sys = { git = "https://github.com/Uzaaft/libghostty-rs", rev = "9ede35b8ea94a55ed3608408d67e102883129f1e", default-features = false, features = ["pkg-config"] }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
dirs = "6"
egui = { version = "0.37", features = ["default_fonts"] }
egui-wgpu = "0.37"
# SVG icons: lucide ships them as SVG, and this rasterises them for egui.
egui_extras = { version = "0.37", features = ["svg"] }
egui-winit = "0.37"
# The system clipboard, written directly: egui-winit's own clipboard path
# silently falls back to an in-app buffer when it cannot reach a display, which
# looks exactly like a copy that worked.
arboard = "3"
# inotify on Linux, ReadDirectoryChangesW on Windows: a device can appear
# without the user doing anything.
notify = "8"
glob = "0.3"
plist = "1.10"
png = "0.18"
pollster = "0.4"
portable-pty = "0.9"
redb = "4"
toml_edit = "0.23"
serialport = "4"
pprof = { version = "0.14", features = ["flamegraph"] }
rustc-demangle = "0.1"
swash = "0.2"
# Terminal cells are laid out on a wcwidth grid: a character is one cell or two.
unicode-width = "0.2"
fontique = "0.12"
tempfile = "3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "io-util", "macros"] }
tokio-serial = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wgpu = "30"
winit = "0.30"
