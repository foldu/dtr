[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Unlicense"

[workspace.dependencies]
# VT core. Pinned to a git rev, not crates.io: 0.2.2's bindings reference C
# functions that do not exist at the ghostty commit the sys crate pins (PLAN §12.4).
libghostty-vt = { git = "https://github.com/Uzaaft/libghostty-rs", rev = "9ede35b8ea94a55ed3608408d67e102883129f1e", default-features = false }
libc = "0.2"
mimalloc = "0.1"
nucleo-matcher = "0.3"
libghostty-vt-sys = { git = "https://github.com/Uzaaft/libghostty-rs", rev = "9ede35b8ea94a55ed3608408d67e102883129f1e", default-features = false, features = ["pkg-config"] }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
dirs = "6"
egui = { version = "0.37", features = ["default_fonts"] }
egui-wgpu = "0.37"
egui-winit = "0.37"
glob = "0.3"
png = "0.18"
pollster = "0.4"
portable-pty = "0.9"
redb = "4"
serialport = "4"
tempfile = "3"
tokio = { version = "1", features = ["rt", "time", "sync", "io-util", "macros"] }
tokio-serial = "5"
tracing = "0.1"
tracing-subscriber = "0.3"
wgpu = "30"
winit = "0.30"
