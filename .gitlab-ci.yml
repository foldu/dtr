workflow:
  rules:
    # The usual pair: run for a merge request, and for a branch with no merge request open.
    # Without the middle rule a branch with an open MR runs the pipeline twice.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - test
  - build

# Everything here needs the toolchain, which only the nix runner has: `nix` is
# the single tag that gets a shell with nix and the host store.
default:
  tags:
    - nix

variables:
  # The devShell is what puts cargo, rustc, zig and libghostty's pkg-config on
  # PATH; nothing is installed globally on the runner.
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  CARGO_TARGET_DIR: $CI_PROJECT_DIR/target
  RUST_BACKTRACE: "1"

test:
  stage: test
  script:
    - nix develop .#default --command cargo test --workspace
    # The benchmark payloads are shell scripts, so nothing compiles them. This
    # proves they still produce bytes, without a window, a GPU or a network.
    - ./scripts/bench.sh --check
  cache:
    key:
      files:
        - Cargo.lock
        - flake.lock
    paths:
      - .cargo/
      - target/
  artifacts:
    when: on_failure
    paths:
      # A kittest snapshot failure writes the picture it drew next to the
      # baseline; without it the log says only "images differ".
      - crates/dtr/tests/snapshots/
    expire_in: 1 week

build:
  stage: build
  script:
    # The one-file Windows executable is the artefact this project exists to
    # produce; a Linux build alone would not catch a cross-compilation break.
    - nix build .#windows
    - ls -l result/bin
  artifacts:
    paths:
      # `nix build` leaves `result` as a symlink; the runner archives what it
      # points at.
      - result/
    expire_in: 1 week
