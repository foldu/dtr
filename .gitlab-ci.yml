workflow:
  rules:
    # The usual pair: run for a merge request, and for a branch with no merge request open.
    # Without the middle rule a branch with an open MR runs the pipeline twice.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - check
  - build

# Everything here needs the toolchain, which only the nix runner has: `nix` is
# the single tag that gets a shell with nix and the host store.
default:
  tags:
    - nix

check:
  stage: check
  script:
    - |
      # The gates are `checks.x86_64-linux` in flake.nix, and this job only
      # invokes them: the test suite, the benchmark payloads, the desktop entry
      # and the single-executable check (which also cross-compiles .#windows).
      # A `cargo` or `nix develop` line here would be a second copy of a gate,
      # and the pipeline would stop meaning the same as a local `nix flake
      # check`. Add checks to the flake, not to this file.
      #
      # The runner's `sh` may be bash, which GitLab starts with `set -eo
      # pipefail`; a failing check must not abort this script before the
      # snapshots have been copied out.
      set +e

      # --keep-failed is for the artifact below. A kittest mismatch writes the
      # picture it drew next to the baseline, inside the failed derivation's
      # build directory, and Nix deletes that directory unless it is asked to
      # keep it — the log otherwise says only "images differ".
      #
      # There is no cargo cache here on purpose: the store is the cache. crane's
      # dependency build is keyed on Cargo.lock and the Cargo.tomls, not on the
      # crates' sources, so a pushed commit recompiles only the workspace while
      # the runner's store keeps the dependency graph.
      { nix flake check -L --keep-failed 2>&1; echo $? >flake-check.status; } | tee flake-check.log
      status=$(cat flake-check.status 2>/dev/null || echo 1)

      if [ "$status" -ne 0 ]; then
        mkdir -p failed-snapshots
        grep -o 'keeping build directory "[^"]*"' flake-check.log |
          cut -d'"' -f2 |
          while read -r dir; do
            find "$dir" -path '*/tests/snapshots/*' -name '*.png' \
              -exec cp {} failed-snapshots/ \;
          done
        exit "$status"
      fi
  artifacts:
    when: on_failure
    paths:
      # Each failing snapshot test's drawn picture, so the job log is not the
      # only thing to read. Empty when the failure was not a snapshot.
      - failed-snapshots/
    expire_in: 1 week

build:
  stage: build
  script:
    # The one-file Windows executable is the artifact this project exists to
    # produce; `nix flake check` asserts the property as `single-exe`, which
    # means it is already in the store by the time this job runs. A Linux-only
    # build would not catch a cross-compilation break, which is why the check
    # stage builds it too.
    - nix build .#windows
    - ls -l result/bin
  artifacts:
    paths:
      # `nix build` leaves `result` as a symlink; the runner archives what it
      # points at.
      - result/
    expire_in: 1 week
