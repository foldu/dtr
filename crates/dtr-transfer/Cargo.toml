[package]
name = "dtr-transfer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The transfer queue: jobs, per-machine segments, and .part-then-publish"

[dependencies]
anyhow.workspace = true
# `Location` is the file manager's answer to "which machine, which path", and a
# transfer's endpoints are exactly that. Nothing else from the VFS is used here:
# this crate has no runtime and does not call a backend.
dtr-vfs = { path = "../dtr-vfs" }

[dev-dependencies]
# A two-line executor for the tests: the queue is async (an SFTP segment is),
# and a test that drives it should own the polling, not a runtime.
pollster.workspace = true
tempfile.workspace = true
