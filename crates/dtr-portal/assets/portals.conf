# The user's half of the packaging, as an example rather than something the
# package installs: this file belongs in
#   $XDG_CONFIG_HOME/xdg-desktop-portal/portals.conf
# and nixosModules.dtr-portal writes the NixOS equivalent into /etc/xdg.
#
# portals.conf(5) resolution order is $XDG_CONFIG_HOME, $XDG_CONFIG_DIRS, the
# build-time sysconfdir, then the data dirs; within one directory a
# `$desktop-portals.conf` is consulted before `portals.conf`, and the first file
# found wins. `default` is the backend for every interface this file does not
# name, and a value may be a semicolon-separated fallback list.
[preferred]
default=gnome
org.freedesktop.impl.portal.FileChooser=dtr
