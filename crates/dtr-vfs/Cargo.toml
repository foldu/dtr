[package]
name = "dtr-vfs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Files, whichever machine they live on: one trait over local and remote"

[dependencies]
anyhow.workspace = true
dirs.workspace = true
dtr-sftp.workspace = true
compio.workspace = true
async-channel.workspace = true
async-lock.workspace = true
tracing.workspace = true

# The Windows listing: `FindFirstFileW` hands back the attributes — and the size and
# the write time — in the call that carries the name, where `read_dir` keeps them to
# itself. Only the Windows half of `local.rs` asks, so this is not a dependency of
# the crate on any other platform.
[target.'cfg(windows)'.dependencies]
dtr-shell = { path = "../dtr-shell" }

[dev-dependencies]
tempfile.workspace = true
