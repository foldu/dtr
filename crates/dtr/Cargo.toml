[package]
name = "dtr"
description = "A serial-first terminal"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
dtr-sftp.workspace = true
dtr-vfs.workspace = true
clap.workspace = true
crossbeam-channel.workspace = true
dirs.workspace = true
dtr-complete = { path = "../dtr-complete" }
dtr-config = { path = "../dtr-config" }
dtr-sshconfig = { path = "../dtr-sshconfig" }
dtr-store = { path = "../dtr-store" }
egui.workspace = true
egui-wgpu.workspace = true
egui-winit.workspace = true
egui_extras.workspace = true
arboard.workspace = true
notify.workspace = true
libghostty-vt.workspace = true
mimalloc.workspace = true
libghostty-vt-sys.workspace = true
plist.workspace = true
png.workspace = true
pollster.workspace = true
portable-pty.workspace = true
redb.workspace = true
fontique.workspace = true
swash.workspace = true
unicode-width.workspace = true
serialport.workspace = true
tokio.workspace = true
tokio-serial.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
wgpu.workspace = true
winit.workspace = true

[dev-dependencies]
# Drives egui without a window: clicks, keys and snapshot rendering. The
# window-based harness needs a real event loop; this one runs in `cargo test`.
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }
tempfile.workspace = true

# Modem control lines are ioctls on the tty descriptor; Windows needs a
# different API and does not have it yet.
# In-process CPU sampling: `perf` is not always permitted (and never on
# Windows), and a terminal that cannot be profiled is a terminal nobody
# optimises.
[target.'cfg(target_os = "linux")'.dependencies]
pprof.workspace = true
rustc-demangle.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
