[package]
name = "dtr"
description = "A super serial terminal which also a file browser for some reason"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Reading the XDG settings portal, and with it following the desktop when it
# changes. Off, the scheme comes from the theme's own name and nothing watches: a
# build that cannot take zbus's tree still gets Adwaita's palette, just not a live
# one.
portal = ["dep:zbus"]
default = ["portal"]

[dependencies]
anyhow.workspace = true
dtr-vfs.workspace = true
clap.workspace = true
crossbeam-channel.workspace = true
dirs.workspace = true
dtr-complete = { path = "../dtr-complete" }
dtr-config = { path = "../dtr-config" }
# The window, the surface and the egui loop, so the desktop's file picker
# (`dtr-portal`) can open a window without a second copy of the traps: DPI,
# surface loss, viewport commands, repaint carrying, drop order.
dtr-frame = { path = "../dtr-frame" }
# The file browser, in a crate of its own because the desktop's file picker is a
# second process drawing the same listing (`docs/manager.md` §2).
dtr-files = { path = "../dtr-files" }
# The frontend glue the portal shares: the winit key table, the click-run
# counter, the listing pump and the write executor. One copy, because a picker
# and a manager disagreeing about what a key or a write means is the drift this
# crate exists to stop.
dtr-pane-host = { path = "../dtr-pane-host" }
dtr-sshconfig = { path = "../dtr-sshconfig" }
dtr-store = { path = "../dtr-store" }
# The transfer queue's core and its ssh adapter: one `Queue` driven on a worker
# thread with one `SshTransport`, so a copy has progress and cancel and the
# `.part`-then-publish rule (`docs/transfers.md`, `docs/files.md` §15).
dtr-transfer = { path = "../dtr-transfer" }
dtr-transfer-ssh = { path = "../dtr-transfer-ssh" }
# The chrome's vocabulary: one palette, one set of metrics, and the controls
# painted from them, so two surfaces cannot disagree about what "hovered" is.
dtr-widgets = { path = "../dtr-widgets" }
egui.workspace = true
egui-wgpu.workspace = true
egui_extras.workspace = true
arboard.workspace = true
# `kitty-graphics` is the core's Rust wrapper for the image storage and the
# render state's placement list; `png` supplies its `RustPngDecoder`, which
# decodes straight into the allocator the core caps (see `kitty.rs`). Both are
# off by default in the workspace dependency so a build that does not draw
# images pays for none of it.
libghostty-vt = { workspace = true, features = ["kitty-graphics", "png"] }
mimalloc.workspace = true
libghostty-vt-sys.workspace = true
plist.workspace = true
png.workspace = true
image.workspace = true
pollster.workspace = true
portable-pty.workspace = true
redb.workspace = true
# The desktop's own file dialog, because a picker has to know about portals,
# drive letters and the platform's idea of a folder. See the workspace comment.
rfd.workspace = true
fontique.workspace = true
swash.workspace = true
unicode-width.workspace = true
shlex.workspace = true
serialport.workspace = true
compio.workspace = true
futures-util.workspace = true
async-channel.workspace = true
tracing.workspace = true
tracing-log.workspace = true
tracing-subscriber.workspace = true
wgpu.workspace = true
winit.workspace = true

[dev-dependencies]
# Drives egui without a window: clicks, keys and snapshot rendering. The
# window-based harness needs a real event loop; this one runs in `cargo test`.
egui_kittest.workspace = true
tempfile.workspace = true

# Modem control lines are ioctls on the tty descriptor; Windows needs a
# different API and does not have it yet.
# In-process CPU sampling: `perf` is not always permitted (and never on
# Windows), and a terminal that cannot be profiled is a terminal nobody
# optimises.
[target.'cfg(target_os = "linux")'.dependencies]
pprof.workspace = true
rustc-demangle.workspace = true
# The native palette: `org.freedesktop.portal.Settings.Read` is how a GNOME
# session states its scheme and its accent without dtr linking GLib. Optional —
# see the `portal` feature.
zbus = { workspace = true, optional = true }
# The user's `gtk.css`: Servo's tokenizer plus a CSS colour parser. See
# `docs/gtk-palette.md` §8 — this is a reader, not a theme engine.
cssparser.workspace = true
csscolorparser.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# The caption's maximise button answers WM_NCHITTEST with HTMAXBUTTON, which is
# what makes Windows 11 show the snap-layout flyout. winit exposes no hook for a
# hit test, so this is a subclassed window procedure.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys.workspace = true
