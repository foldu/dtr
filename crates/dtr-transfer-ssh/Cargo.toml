[package]
name = "dtr-transfer-ssh"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The remote half of the transfer queue: a Transport over dtr-sftp and the local transport"

[dependencies]
anyhow.workspace = true
compio.workspace = true
dtr-sftp.workspace = true
dtr-vfs.workspace = true
