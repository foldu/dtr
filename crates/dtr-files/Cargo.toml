[package]
name = "dtr-files"
description = "The file browser: a listing, a selection, and the views over them"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# `dirs::home_dir`, for the `~` in a displayed path. The browser shows paths, so
# it needs to know where home is; nothing else about the machine.
anyhow.workspace = true
async-channel.workspace = true
dirs.workspace = true
egui.workspace = true
# A grid cell shows the picture, not the name, and the decode is the one place
# the browser touches bytes rather than a listing. `png` and `jpeg` only, as the
# terminal does: a preview of a RAW file is a build nobody asked for.
image.workspace = true
# The listing, batched and off the drawing thread. `dtr-vfs` and not `std::fs`:
# the same browser draws a remote directory, and a listing whose shape differs by
# machine is two models.
dtr-vfs = { path = "../dtr-vfs" }
# The desktop's own pictures and places. The Win32 crate, which answers "there is
# no shell" on a machine that has none: this crate asks it and never sees an
# `HICON`, and the icon theme below is what a freedesktop machine answers with.
dtr-shell = { path = "../dtr-shell" }
# The look, and the two egui quirks a painted pane has to know about. Not `dtr`:
# the file picker is a second process and cannot link a terminal.
dtr-widgets = { path = "../dtr-widgets" }

[dev-dependencies]
egui_kittest.workspace = true
tempfile.workspace = true

# `access(W_OK)`, for one question a save has to ask: may anything be written
# here? The permission bit alone answers `0644` about a file an ACL forbids, and
# `/usr/bin` is not marked read-only either.
[target.'cfg(unix)'.dependencies]
libc.workspace = true
